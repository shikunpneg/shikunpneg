<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" preserveAspectRatio="xMidYMid meet" width="960" height="240">
  <!-- 黑白 cyberpunk banner · 适配 GitHub CAMO（无 CSS 动画、无滤镜，纯 SVG 原生元素） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
    <pattern id="scan" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="240" fill="url(#bg)"/>
  <rect width="960" height="240" fill="url(#grid)"/>

  <!-- 远景天际线 -->
  <g fill="#ffffff" fill-opacity="0.25">
    <polygon points="0,200 0,160 60,160 60,130 110,130 110,180 160,180 160,150 210,150 210,190 260,190 260,170 310,170 310,140 360,140 360,180 410,180 410,150 460,150 460,180 510,180 510,140 560,140 560,170 610,170 610,150 660,150 660,180 710,180 710,160 760,160 760,180 810,180 810,140 860,140 860,180 910,180 910,160 960,160 960,200"/>
    <rect x="100" y="180" width="4" height="14"/>
    <rect x="200" y="150" width="4" height="18"/>
    <rect x="350" y="140" width="4" height="22"/>
    <rect x="560" y="140" width="4" height="22"/>
    <rect x="810" y="140" width="4" height="22"/>
  </g>

  <!-- 二进制流 -->
  <g font-family="Courier New, monospace" font-size="9" fill="#ffffff" fill-opacity="0.25">
    <text x="30" y="40">01001000 01100101</text>
    <text x="30" y="55">01101100 01101100</text>
    <text x="740" y="40">01101011 01110101</text>
    <text x="740" y="55">01110000 01101110</text>
  </g>

  <!-- 主字 SHIKUNPNEG · 单层（避免 glitch 在 CAMO 被剥） -->
  <text x="480" y="135" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="72" fill="#ffffff" letter-spacing="6">SHIKUNPNEG</text>

  <!-- 副标题 -->
  <text x="480" y="165" text-anchor="middle"
        font-family="Courier New, monospace" font-size="14"
        fill="#ffffff" fill-opacity="0.85" letter-spacing="4">
    &gt;&gt; ENGINEER · ORACLE BONE · DEVELOPER &lt;&lt;
  </text>

  <!-- HUD -->
  <g font-family="Courier New, monospace" font-size="10" fill="#ffffff" fill-opacity="0.7">
    <text x="30" y="90">SYS://SHIKUNPNEG</text>
    <text x="30" y="105">LAT: 30.5928 N</text>
    <text x="30" y="120">LON: 114.3055 E</text>
  </g>
  <g font-family="Courier New, monospace" font-size="10" fill="#ffffff" fill-opacity="0.7" text-anchor="end">
    <text x="930" y="90">[ ONLINE ]</text>
    <text x="930" y="105">FPS: 60.0</text>
    <text x="930" y="120">v0.1.0 · 2026</text>
  </g>

  <!-- 四角括号 -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M 20 20 L 20 50 M 20 20 L 50 20"/>
    <path d="M 940 20 L 940 50 M 940 20 L 910 20"/>
    <path d="M 20 220 L 20 190 M 20 220 L 50 220"/>
    <path d="M 940 220 L 940 190 M 940 220 L 910 220"/>
  </g>

  <!-- 扫描线 -->
  <rect width="960" height="240" fill="url(#scan)"/>
</svg>