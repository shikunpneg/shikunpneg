<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <!-- 黑白 cyberpunk banner · 800px 宽统一 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
    <pattern id="scan" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="800" height="240" fill="url(#bg)"/>
  <rect width="800" height="240" fill="url(#grid)"/>

  <!-- 远景天际线 -->
  <g fill="#ffffff" fill-opacity="0.25">
    <polygon points="0,200 0,160 50,160 50,130 100,130 100,180 150,180 150,150 200,150 200,190 250,190 250,170 300,170 300,140 350,140 350,180 400,180 400,150 450,150 450,180 500,180 500,140 550,140 550,170 600,170 600,150 650,150 650,180 700,180 700,160 750,160 750,180 800,180 800,200"/>
    <rect x="90" y="180" width="4" height="14"/>
    <rect x="190" y="150" width="4" height="18"/>
    <rect x="340" y="140" width="4" height="22"/>
    <rect x="540" y="140" width="4" height="22"/>
    <rect x="740" y="160" width="4" height="14"/>
  </g>

  <!-- 二进制流 -->
  <g font-family="Courier New, monospace" font-size="9" fill="#ffffff" fill-opacity="0.25">
    <text x="20" y="38">01001000 01100101 01101100 01101100</text>
    <text x="20" y="52">01001111 01010000 01000101 01001110</text>
    <text x="540" y="38">01010011 01001111 01010101 01010010</text>
    <text x="540" y="52">01000011 01000101 00100000 01001111</text>
  </g>

  <!-- 主字 SHIKUNPNEG -->
  <text x="400" y="135" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="64" fill="#ffffff" letter-spacing="6">SHIKUNPNEG</text>

  <!-- 副标题 -->
  <text x="400" y="165" text-anchor="middle"
        font-family="Courier New, monospace" font-size="14"
        fill="#ffffff" fill-opacity="0.85" letter-spacing="4">
    &gt;&gt; ENGINEER · ORACLE BONE · DEVELOPER &lt;&lt;
  </text>

  <!-- HUD -->
  <g font-family="Courier New, monospace" font-size="10" fill="#ffffff" fill-opacity="0.7">
    <text x="20" y="85">SYS://SHIKUNPNEG</</text>
    <text x="20" y="100">LAT: 30.5928 N</text>
    <text x="20" y="115">LON: 114.3055 E</text>
  </g>
  <g font-family="Courier New, monospace" font-size="10" fill="#ffffff" fill-opacity="0.7" text-anchor="end">
    <text x="780" y="85">[ ONLINE ]</text>
    <text x="780" y="100">FPS: 60.0</text>
    <text x="780" y="115">v0.1.0 · 2026</text>
  </g>

  <!-- 四角括号 -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M 15 15 L 15 45 M 15 15 L 45 15"/>
    <path d="M 785 15 L 785 45 M 785 15 L 755 15"/>
    <path d="M 15 225 L 15 195 M 15 225 L 45 225"/>
    <path d="M 785 225 L 785 195 M 785 225 L 755 225"/>
  </g>

  <!-- 扫描线 -->
  <rect width="800" height="240" fill="url(#scan)"/>
</svg>