<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 50" width="540" height="50">
  <!-- 自渲染打字动画 · 用原生 <animate>（GitHub CAMO 兼容） -->
  <rect width="540" height="50" rx="4" fill="#0a0a0a"/>

  <!-- Line 1: DEVELOPER · ENGINEER · OPEN SOURCE -->
  <text x="12" y="32" font-family="Courier New, monospace" font-size="18"
        font-weight="700" fill="#ffffff" letter-spacing="2" opacity="1">
    &gt; DEVELOPER · ENGINEER · OPEN
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.25;0.27;0.6;0.62;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Line 2: MANDARIN · AI · ORACLE BONE -->
  <text x="12" y="32" font-family="Courier New, monospace" font-size="18"
        font-weight="700" fill="#ffffff" letter-spacing="2" opacity="0">
    &gt; MANDARIN · AI · ORACLE BONE
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.33;0.6;0.63;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Line 3: 电脑前端 · 中文语言 -->
  <text x="12" y="32" font-family="Courier New, monospace" font-size="18"
        font-weight="700" fill="#ffffff" letter-spacing="2" opacity="0">
    &gt; 电脑前端 · 中文语言
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.68;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- 闪烁光标（独立动画） -->
  <rect x="528" y="14" width="8" height="26" fill="#ffffff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>