  <text x="380" y="50" text-anchor="end" font-family="Courier New, monospace" font-size="9"
        fill="#8b8b8b" letter-spacing="1">v0.1.0</text>

  <!-- 底部小标识 -->
  <line x1="20" y1="110" x2="380" y2="110" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.5"/>
  <text x="20" y="117" font-family="Courier New, monospace" font-size="8"
        fill="#8b8b8b" letter-spacing="1">[ PUBLIC ]</text>
  <text x="380" y="117" text-anchor="end" font-family="Courier New, monospace" font-size="8"
        fill="#8b8b8b" letter-spacing="1">2026-08-21</text>
