<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- 仓库卡片 1: Oracle-Bone-Script-IME（自渲染，GitHub CAMO 100% 兼容） -->
  <rect width="400" height="120" rx="6" fill="#0a0a0a" stroke="#ffffff" stroke-width="1"/>

  <!-- 顶部色带 -->
  <rect width="400" height="4" fill="#ffffff"/>

  <!-- 仓库名（粗体大字号） -->
  <text x="20" y="32" font-family="Arial Black, sans-serif" font-size="16"
        font-weight="900" fill="#ffffff" letter-spacing="1">Oracle-Bone-Script-IME</text>

  <!-- Owner/路径 -->
  <text x="20" y="50" font-family="Courier New, monospace" font-size="10"
        fill="#8b8b8b" letter-spacing="1">shikunpneg / Python</text>

  <!-- 描述 -->
  <text x="20" y="74" font-family="Microsoft YaHei, sans-serif" font-size="12"
