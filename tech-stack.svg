<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" preserveAspectRatio="xMidYMid meet">
  <!-- 自渲染黑白技术栈图标（GitHub 同源确保 100% 可加载） -->
  <style>
    .icon { fill: #ffffff; }
    .label { fill: #ffffff; font-family: 'Courier New', monospace; font-size: 10px; text-anchor: middle; letter-spacing: 1px; }
  </style>

  <rect width="800" height="100" fill="#0a0a0a"/>

  <!-- 19 个简化图标（2x10 网格），每个 40x40 -->
  <g transform="translate(10, 10)">
    <!-- Python -->
    <g transform="translate(0,0)">
      <rect x="2" y="2" width="36" height="36" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Py</text>
    </g>
    <text class="label" x="20" y="56">PYTHON</text>

    <!-- TypeScript -->
    <g transform="translate(80,0)">
      <rect x="2" y="2" width="36" height="36" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">TS</text>
    </g>
    <text class="label" x="100" y="56">TS</text>

    <!-- JavaScript -->
    <g transform="translate(160,0)">
      <rect x="2" y="2" width="36" height="36" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="white">JS</text>
    </g>
    <text class="label" x="180" y="56">JS</text>

    <!-- Go -->
    <g transform="translate(240,0)">
      <rect x="2" y="2" width="36" height="36" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="white">G</text>
    </g>
    <text class="label" x="260" y="56">GO</text>

    <!-- Rust -->
    <g transform="translate(320,0)">
      <rect x="2" y="2" width="36" height="36" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="white">R</text>
    </g>
    <text class="label" x="340" y="56">RUST</text>

    <!-- Vue -->
    <g transform="translate(400,0)">
      <polygon points="20,2 38,32 2,32" fill="none" stroke="white" stroke-width="1.5"/>
    </g>
    <text class="label" x="420" y="56">VUE</text>

    <!-- React -->
    <g transform="translate(480,0)">
      <circle cx="20" cy="20" r="3" fill="white"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="white" stroke-width="1.5"/>
      <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="white" stroke-width="1.5"/>
      <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="white" stroke-width="1.5" transform="rotate(60 20 20)"/>
      <ellipse cx="20" cy="20" rx="16" ry="6" fill="none" stroke="white" stroke-width="1.5" transform="rotate(-60 20 20)"/>
    </g>
    <text class="label" x="500" y="56">REACT</text>

    <!-- Next.js -->
    <g transform="translate(560,0)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">N</text>
    </g>
    <text class="label" x="580" y="56">NEXT.JS</text>

    <!-- Tailwind -->
    <g transform="translate(640,0)">
      <path d="M 5 28 Q 12 12 22 20 T 35 12" fill="none" stroke="white" stroke-width="1.5"/>
    </g>
    <text class="label" x="660" y="56">TAILWIND</text>

    <!-- Node.js -->
    <g transform="translate(720,0)">
      <rect x="4" y="10" width="32" height="22" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="white">JS</text>
    </g>
    <text class="label" x="740" y="56">NODE</text>
  </g>

  <g transform="translate(10, 56)">
    <!-- FastAPI -->
    <g transform="translate(0,0)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="24" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">FA</text>
    </g>
    <text class="label" x="20" y="42">FASTAPI</text>

    <!-- Docker -->
    <g transform="translate(80,0)">
      <rect x="4" y="14" width="32" height="20" fill="none" stroke="white" stroke-width="1.5"/>
      <circle cx="20" cy="24" r="3" fill="white"/>
    </g>
    <text class="label" x="100" y="42">DOCKER</text>

    <!-- K8s -->
    <g transform="translate(160,0)">
      <polygon points="20,4 34,12 34,28 20,36 6,28 6,12" fill="none" stroke="white" stroke-width="1.5"/>
    </g>
    <text class="label" x="180" y="42">KUBERNETES</text>

    <!-- Linux -->
    <g transform="translate(240,0)">
      <rect x="6" y="10" width="28" height="22" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="white">L</text>
    </g>
    <text class="label" x="260" y="42">LINUX</text>

    <!-- Git -->
    <g transform="translate(320,0)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="white" stroke-width="1.5"/>
      <line x1="20" y1="6" x2="20" y2="34" stroke="white" stroke-width="1.5"/>
      <line x1="6" y1="20" x2="34" y2="20" stroke="white" stroke-width="1.5"/>
      <line x1="10" y1="10" x2="30" y2="30" stroke="white" stroke-width="1.5"/>
      <line x1="30" y1="10" x2="10" y2="30" stroke="white" stroke-width="1.5"/>
    </g>
    <text class="label" x="340" y="42">GIT</text>

    <!-- GitHub -->
    <g transform="translate(400,0)">
      <circle cx="20" cy="20" r="14" fill="white"/>
    </g>
    <text class="label" x="420" y="42">GITHUB</text>

    <!-- VS Code -->
    <g transform="translate(480,0)">
      <rect x="6" y="6" width="28" height="28" fill="none" stroke="white" stroke-width="1.5"/>
      <path d="M 14 14 L 22 22 L 14 30" fill="none" stroke="white" stroke-width="1.5"/>
    </g>
    <text class="label" x="500" y="42">VSCODE</text>

    <!-- FastAPI -->
    <g transform="translate(560,0)">
      <rect x="4" y="10" width="32" height="20" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">N</text>
    </g>
    <text class="label" x="580" y="42">NEO4J</text>

    <!-- Rust -->
    <g transform="translate(640,0)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="24" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">DB</text>
    </g>
    <text class="label" x="660" y="42">DATABASE</text>

    <!-- Docker compose -->
    <g transform="translate(720,0)">
      <rect x="4" y="10" width="32" height="20" fill="none" stroke="white" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Arial" font-size="9" font-weight="bold" text-anchor="middle" fill="white">CI</text>
    </g>
    <text class="label" x="740" y="42">CI/CD</text>
  </g>
</svg>